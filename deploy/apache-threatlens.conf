# ThreatLens behind Apache over HTTPS (single reverse-proxy vhost).
#
# Enable modules once:   a2enmod ssl proxy proxy_http headers rewrite
# Install:               copy to /etc/apache2/sites-available/threatlens.conf, edit the
#                        placeholders below, then:  a2ensite threatlens && apache2ctl configtest && systemctl reload apache2
#
# The Node backend (deploy/threatlens.service) serves BOTH the UI and the API on 127.0.0.1:5000,
# so one "ProxyPass /" covers everything: UI, /upload, /analyze/email, /admin/*, /api/*, /uploads/*.
# In project/.env set:  SERVER_URL=https://<your-hostname>   TRUST_PROXY=loopback

<VirtualHost *:443>
    # your hostname:
    ServerName threatlens.example.internal

    SSLEngine on
    # your certificate (e.g. from your internal PKI) and its private key:
    SSLCertificateFile    /path/to/your.crt
    SSLCertificateKeyFile /path/to/your.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # AI agent calls can take a while; the live agent stream (SSE) is long-lived.
    ProxyTimeout 300

    ProxyPass        / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Apache does not buffer the SSE stream (/api/swarm-stream) with plain mod_proxy_http.
    # If you add mod_deflate for all content types or another buffering layer in front,
    # exclude /api/swarm-stream from it.
</VirtualHost>

# Optional: redirect plain HTTP to HTTPS (uncomment and set the hostname).
#<VirtualHost *:80>
#    ServerName threatlens.example.internal
#    Redirect permanent / https://threatlens.example.internal/
#</VirtualHost>
